<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Lagu</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #3D0000, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            margin: auto;
            animation: fadeIn 1s ease-in-out;
        }
        .album-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
        }
        h2 {
            font-size: 18px;
            color: #555;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #000000, #222222);
            color: rgb(255, 255, 255);
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.2);
            width: 80%;
            text-align: center;
        }
        .btn:hover {
            background: linear-gradient(135deg, #222222, #444444);
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="c:\Users\ASUS\OneDrive\Documents\Music Album\LEONOEL.png" alt="Cover Album" class="album-cover">
            <h1>Warm Friend</h1>
            <h2>Jeremia Wantah</h2>
            <p>klik di bawah kong dengar jo reen, new song soon!</p>
            <div class="buttons">
                <a href="https://open.spotify.com/track/4O2YDrqZMMQvAB1nYTpsN0?si=67de68b1883847e2" class="btn" target="_blank">Spotify</a>
                <a href="https://music.apple.com/us/album/warm-friend-single/1775117403" class="btn" target="_blank">Apple Music</a>
                <a href="https://music.youtube.com/watch?v=sUHvn-iMDTE&si=n6R17EOIdcG9PAb4" class="btn" target="_blank">YouTube Music</a>
            </div>
        </div>
    </div>
</body>
</html>
